[project]
name = "nixer"
version = "0.2.0"
description = "Nix-only specialist MCP and fixed evidence adapter for Nix/Nixpkgs/NixOS"
requires-python = ">=3.10"
dependencies = ["mcp==1.30.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.setuptools]
py-modules = ["server", "evidence"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]