name: nixer-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  nixer-ci:
    name: nixer-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Nixer
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q tests
      - name: Run Ruff
        run: ruff check server.py evidence.py tests
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Evaluate flake
        run: nix flake check --no-build
      - name: Build Nixer package check
        run: nix build .#checks.x86_64-linux.package --no-link
